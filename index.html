<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Pink Queue Remote</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;
  background:#fff5fa;
  color:#3b1830;
}

body{
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  min-height:100vh;
  padding:16px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% -10%,
      #ffb9d9 0%,
      #ffe3ef 28%,
      #fff8fb 62%,
      #ffffff 100%
    );
}

/* พื้นหลังตกแต่ง */

.bgCircle{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  opacity:.35;
  filter:blur(2px);
}

.c1{
  width:300px;
  height:300px;
  background:#ff8fbd;
  top:-150px;
  left:-120px;
}

.c2{
  width:350px;
  height:350px;
  background:#ffd0e3;
  right:-180px;
  bottom:-130px;
}

.c3{
  width:160px;
  height:160px;
  background:#ffb2d2;
  right:10%;
  top:20%;
  opacity:.18;
}

/* HEADER */

.header{
  width:min(1200px,100%);
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:16px 20px;

  background:#ffffffd9;
  border:1px solid #ffffff;
  border-radius:22px;

  box-shadow:
    0 12px 35px #d65d941f;

  backdrop-filter:blur(18px);
}

.logo{
  font-size:23px;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo .pink{
  color:#ec4d91;
}

.mode{
  padding:8px 14px;
  border-radius:50px;
  background:#fff0f7;
  color:#d93f82;
  font-size:13px;
  font-weight:900;
}

/* CONTAINER */

.container{
  width:min(1050px,100%);
  margin:25px auto;
}

/* CARD */

.card{
  background:#ffffffec;
  border:1px solid #ffffff;
  border-radius:30px;
  padding:28px;

  box-shadow:
    0 20px 60px #d64b8b18;

  backdrop-filter:blur(20px);
}

/* DISPLAY */

.displayArea{
  min-height:calc(100vh - 110px);
  display:grid;
  place-items:center;
}

.displayCard{
  width:min(900px,95vw);
  text-align:center;
  padding:45px 30px;
}

.displayTitle{
  font-size:clamp(18px,3vw,28px);
  color:#b45c85;
  font-weight:900;
}

.currentQueue{
  font-size:
    clamp(
      100px,
      22vw,
      220px
    );

  line-height:.9;

  margin:40px 0 25px;

  font-weight:1000;

  color:#e63f87;

  letter-spacing:-7px;

  text-shadow:
    0 12px 30px #e63f8720;
}

.channel{
  font-size:clamp(20px,4vw,32px);
  font-weight:900;
  color:#8c4569;
}

.waiting{
  margin-top:16px;
  color:#b17696;
  font-size:17px;
}

/* CONTROL */

.controlTitle{
  font-size:22px;
  font-weight:1000;
  color:#6d294d;
}

.controlCurrent{
  text-align:center;
  font-size:
    clamp(
      80px,
      16vw,
      150px
    );

  font-weight:1000;
  line-height:1;

  color:#e63f87;

  margin:25px 0;
}

.controlInfo{
  text-align:center;
  color:#a66b88;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:25px;
}

.btn{
  min-height:62px;

  border-radius:17px;

  font-size:17px;
  font-weight:1000;

  transition:
    transform .15s,
    box-shadow .15s;
}

.btn:active{
  transform:scale(.96);
}

.primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      #ff579b,
      #e72f7e
    );

  box-shadow:
    0 10px 25px #ed428425;
}

.secondary{
  color:#9a3d68;
  background:#fff0f7;
}

.success{
  color:white;

  background:
    linear-gradient(
      135deg,
      #36c998,
      #18a878
    );
}

.danger{
  color:white;

  background:
    linear-gradient(
      135deg,
      #ff6b83,
      #ed3e5e
    );
}

.wide{
  grid-column:1/-1;
}

/* KIOSK */

.kioskArea{
  min-height:calc(100vh - 110px);

  display:grid;
  place-items:center;
}

.kioskButton{
  width:min(700px,94vw);
  height:min(570px,65vh);

  border-radius:45px;

  color:white;

  background:
    linear-gradient(
      145deg,
      #ff75ae,
      #ed3c86
    );

  box-shadow:
    0 30px 80px #d7357b35;

  font-size:
    clamp(
      42px,
      9vw,
      85px
    );

  font-weight:1000;

  transition:
    transform .15s,
    box-shadow .15s;
}

.kioskButton:active{
  transform:scale(.97);
}

.kioskIcon{
  display:block;
  font-size:1.1em;
  margin-bottom:20px;
}

.kioskSub{
  display:block;
  margin-top:20px;
  font-size:18px;
  opacity:.85;
  font-weight:700;
}

/* POPUP */

.popup{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;
  place-items:center;

  padding:20px;

  background:#3b1830a8;
  backdrop-filter:blur(8px);
}

.popup.show{
  display:grid;
}

.ticket{
  width:min(560px,94vw);

  background:white;

  border-radius:32px;

  padding:35px;

  text-align:center;

  box-shadow:
    0 30px 100px #0003;

  animation:
    popupIn .25s ease;
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.ticketTitle{
  font-size:22px;
  color:#a15c7d;
  font-weight:900;
}

.ticketNumber{
  margin:25px 0;

  font-size:
    clamp(
      90px,
      20vw,
      170px
    );

  line-height:1;

  font-weight:1000;

  color:#e83f87;
}

.ticketText{
  color:#a66b88;
  font-size:17px;
}

/* LOCK */

.lock{
  position:fixed;
  inset:0;

  z-index:200;

  display:none;
  place-items:center;

  background:
    #fff7fbeF;

  backdrop-filter:blur(18px);

  text-align:center;
}

.lock.show{
  display:grid;
}

.lockIcon{
  font-size:90px;
  margin-bottom:15px;
}

.lockTitle{
  font-size:30px;
  font-weight:1000;
  color:#702b4f;
}

.lockText{
  color:#a86b88;
}

/* LOGIN */

.loginArea{
  min-height:calc(100vh - 110px);

  display:grid;
  place-items:center;
}

.loginCard{
  width:min(500px,95vw);
}

.loginTitle{
  font-size:32px;
  font-weight:1000;
  color:#702b4f;
}

.loginDescription{
  color:#a66b88;
  line-height:1.6;
}

.input{
  width:100%;

  margin-top:10px;

  padding:17px;

  border-radius:15px;

  border:2px solid #f6dce9;

  background:#fffafd;

  outline:none;

  color:#55213d;

  font-size:17px;
}

.input:focus{
  border-color:#f17bab;
}

.message{
  min-height:25px;
  margin-top:14px;
  color:#d13e7b;
  font-weight:700;
}

.infoBox{
  margin-top:18px;
  padding:13px 15px;

  border-radius:14px;

  background:#fff3f8;

  color:#a96c89;

  font-size:14px;

/* ONLINE */

.online{
  display:inline-flex;
  align-items:center;
  gap:7px;

  color:#28a77b;

  font-size:13px;
  font-weight:900;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35c997;
}

/* MOBILE */

@media(max-width:700px){

  .app{
    padding:10px;
  }

  .header{
    padding:14px;
    border-radius:18px;
  }

  .logo{

  }

  .buttons{
    grid-template-columns:1fr;
  }

  .wide{
    grid-column:auto;
  }

  .card{
    padding:21px;
    border-radius:24px;
  }

  .displayCard{
    padding:35px 18px;
  }

  .kioskButton{
    height:62vh;
    border-radius:35px;
  }

}

@media(max-height:600px){

  .kioskButton{
    height:72vh;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="bgCircle c1"></div>
  <div class="bgCircle c2"></div>
  <div class="bgCircle c3"></div>

  <div id="root"></div>

</div>

<script>

/* =========================================================
   API ของคุณ
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbx0vgr-86AFRYBAzJCglbLAaMjauxQ65YM_5lqlJZiDsUFPWVmdLzx2Smp5NhsHTjQODQ/exec";


/* =========================================================
   MODE
========================================================= */

const params =
new URLSearchParams(location.search);

const mode =
params.get("mode") || "display";


/*
  ?mode=display
  ?mode=control
  ?mode=kiosk
*/


/* =========================================================
   DATA
========================================================= */

let data = {

  current:"-",

  channel:"1",

  locked:false,

  waiting:0

};


/* =========================================================
   LOGIN
========================================================= */

let verified =
sessionStorage.getItem(
  "QUEUE_VERIFIED"
) === "1";

let verifiedEmail =
sessionStorage.getItem(
  "QUEUE_EMAIL"
) || "";


/* =========================================================
   JSONP API
========================================================= */

function request(
  action,
  body={}
){

  return new Promise(
    (resolve,reject)=>{

      const callback =
        "queueCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random()*99999
        );


      window[callback] =
        function(result){

          try{
            delete window[callback];
          }catch(e){}

          if(script){
            script.remove();
          }

          resolve(result);

        };


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callback
      );


      Object.keys(body)
      .forEach(
        key=>{

          query.set(
            key,
            body[key]
          );

        }
      );


      const script =
        document.createElement(
          "script"
        );


      script.src =
        API +
        "?" +
        query.toString();


      script.onerror =
        function(){

          try{
            delete window[callback];
          }catch(e){}

          script.remove();

          reject(
            new Error(
              "เชื่อมต่อระบบคิวไม่ได้"
            )
          );

        };


      document.body.appendChild(
        script
      );


      setTimeout(
        function(){

          if(
            typeof window[callback]
            === "function"
          ){

            try{
              delete window[callback];
            }catch(e){}

            script.remove();

            reject(
              new Error(
                "ระบบไม่ตอบกลับ"
              )
            );

          }

        },
        12000
      );

    }
  );

}


/* =========================================================
   SOUND
========================================================= */

function beep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return;


    const ctx =
      new AudioContext();


    const tones =
      [660,880,1040];


    tones.forEach(
      (frequency,index)=>{

        const oscillator =
          ctx.createOscillator();

        const gain =
          ctx.createGain();


        oscillator.type =
          "sine";

        oscillator.frequency.value =
          frequency;


        oscillator.connect(
          gain
        );

        gain.connect(
          ctx.destination
        );


        gain.gain.setValueAtTime(
          .12,
          ctx.currentTime+
          index*.15
        );


        oscillator.start(
          ctx.currentTime+
          index*.15
        );


        oscillator.stop(
          ctx.currentTime+
          index*.15+
          .13
        );

      }
    );

  }catch(e){

    console.log(e);

  }

}


/* =========================================================
   VOICE
========================================================= */

function speak(
  number,
  channel
){

  try{

    if(
      !window.speechSynthesis
    )
      return;


    speechSynthesis.cancel();


    const voice =
      new SpeechSynthesisUtterance(
        "เชิญหมายเลข " +
        number +
        " ที่ช่อง " +
        channel
      );


    voice.lang =
      "th-TH";

    voice.rate =
      .88;

    voice.pitch =
      1;


    speechSynthesis.speak(
      voice
    );

  }catch(e){

    console.log(e);

  }

}


/* =========================================================
   ESC
========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(char){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char];

    }
  );

}


/* =========================================================
   HEADER
========================================================= */

function header(
  title
){

  return `

    <div class="header">

      <div class="logo">
        QUEUE
        <span class="pink">
          REMOTE
        </span>
      </div>

      <div style="display:flex;align-items:center;gap:12px">

        <div class="online">
          <span class="dot"></span>
          ONLINE
        </div>

        <div class="mode">
          ${esc(title)}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

  root.innerHTML = `

    ${header("CONTROL")}

    <div class="loginArea">

      <div class="card loginCard">

        <div class="loginTitle">
          🔐 เข้าสู่ระบบ Control
        </div>

        <p class="loginDescription">
          กรุณายืนยันอีเมลก่อนเข้าสู่
          ระบบควบคุมคิว
        </p>

        <input
          id="email"
          class="input"
          type="email"
          placeholder="กรอกอีเมล"
          autocomplete="email"
        >

        <button
          class="btn primary"
          style="width:100%;margin-top:13px"
          onclick="sendOTP()"
        >
          📧 ส่งรหัสยืนยัน
        </button>


        <div
          id="otpArea"
          style="display:none"
        >

          <input
            id="otp"
            class="input"
            inputmode="numeric"
            maxlength="6"
            placeholder="รหัส 6 หลัก"
          >

          <button
            class="btn success"
            style="width:100%;margin-top:13px"
            onclick="verifyOTP()"
          >
            ✓ ยืนยันรหัส
          </button>

        </div>


        <div
          id="loginMessage"
          class="message"
        ></div>


        <div class="infoBox">

          🔒 รหัสยืนยันมีอายุ 5 นาที

          <br>

          ระบบจะจำการยืนยันไว้เฉพาะแท็บนี้

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   SEND OTP
========================================================= */

async function sendOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const message =
    document.getElementById(
      "loginMessage"
    );


  if(!email){

    message.textContent =
      "กรุณากรอกอีเมล";

    return;

  }


  message.textContent =
    "กำลังส่งรหัส...";


  try{

    const result =
      await request(
        "sendOTP",
        {
          email:email
        }
      );


    if(result.ok){

      message.textContent =
        "ส่งรหัสไปที่อีเมลแล้ว 📧";


      document
        .getElementById(
          "otpArea"
        )
        .style.display =
        "block";


    }else{

      message.textContent =
        result.error ||
        "ส่งรหัสไม่สำเร็จ";

    }

  }catch(error){

    message.textContent =
      error.message;

  }

}


/* =========================================================
   VERIFY OTP
========================================================= */

async function verifyOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  const message =
    document.getElementById(
      "loginMessage"
    );


  if(!otp){

    message.textContent =
      "กรุณากรอกรหัส 6 หลัก";

    return;

  }


  message.textContent =
    "กำลังตรวจสอบ...";


  try{

    const result =
      await request(
        "verifyOTP",
        {
          email:email,
          otp:otp
        }
      );


    if(result.ok){

      verified = true;

      verifiedEmail =
        email;


      sessionStorage.setItem(
        "QUEUE_VERIFIED",
        "1"
      );


      sessionStorage.setItem(
        "QUEUE_EMAIL",
        email
      );


      render();

      refresh();


    }else{

      message.textContent =
        result.error ||
        "รหัสไม่ถูกต้อง";

    }

  }catch(error){

    message.textContent =
      error.message;

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function showDisplay(){

  root.innerHTML = `

    ${header("DISPLAY")}

    <div class="displayArea">

      <div class="card displayCard">

        <div class="displayTitle">
          🎀 เชิญคิวถัดไป
        </div>

        >

        </div>

        <div class="channel">

        </div>

        <div class="waiting">
          คิวที่กำลังรอ
          <b>
            ${data.waiting}
          </b>
          คิว
        </div>

      </div>

    </div>


    <div
      id="lockScreen"

        ? "show"

      }"
    >

      <div>

        <div class="lockIcon">
          🔒
        </div>

        <div class="lockTitle">
          หน้าจอถูกล็อก
        </div>

        <div class="lockText">
          กรุณารอเจ้าหน้าที่
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   CONTROL
========================================================= */

function showControl(){

  root.innerHTML = `

    ${header("CONTROL")}

    <div class="container">

      <div class="card">

        <div class="controlTitle">
          🎛️ ศูนย์ควบคุมคิว
        </div>

        <div
          style="
            margin-top:7px;
            color:#ad7692;
            font-size:14px;
          "
        >
          ${esc(verifiedEmail)}
        </div>


        <div

        </div>


        <div class="controlInfo">

          ช่อง
          <b>
            ${esc(data.channel)}
          </b>

          &nbsp; • &nbsp;

          รอ
          <b>
            ${data.waiting}
          </b>
          คิว

        </div>


        <div class="buttons">


          <button

          >

          >

/* =========================================================
   KIOSK
========================================================= */

function showKiosk(){

  root.innerHTML = `

    ${header("KIOSK")}

    <div class="kioskArea">

      <button
        class="kioskButton"
        onclick="takeTicket()"
      >

        </span>

        </span>

      </button>

    <div

    >

      <div class="ticket">

          🎀 บัตรคิวของคุณ
        </div>

        <div

        </div>

      </div>

/* =========================================================
   REFRESH
========================================================= */

async function refresh(){

  try{

    const result =
      await request(
        "state"
      );


    if(
      result &&
      (
        result.ok === true ||
        result.current !== undefined
      )
    ){

      data = {

        current:
          result.current ?? "-",

        channel:
          result.channel ?? "1",

        locked:
          result.locked === true ||
          String(
            result.locked
          ).toLowerCase()
          === "true",

        waiting:
          Number(
            result.waiting ?? 0
          )

      };


      if(mode === "display"){

        showDisplay();

      }


      if(mode === "control" &&
         verified){

        showControl();

      }

    }

  }catch(error){

    console.log(
      "Refresh error:",
      error
    );

  }

}


/* =========================================================
   NEXT
========================================================= */

async function nextQueue(){

  try{

    const result =
      await request(
        "next"
      );


    if(result.ok){

      beep();

      speak(
        result.number,
        result.channel
      );

      data.current =
        result.number;

      data.channel =
        result.channel;

      refresh();


    }else{

      alert(
        result.error ||
        "ไม่มีคิวรอ"
      );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================================
   RECALL
========================================================= */

function recallQueue(){

  if(
    !data.current ||
    data.current === "-"
  ){

    alert(
      "ยังไม่มีคิวที่ถูกเรียก"
    );

    return;

  }


  beep();

  speak(
    data.current,
    data.channel
  );

}


/* =========================================================
   LOCK
========================================================= */

async function toggleLock(){

  try{

    const result =
      await request(
        "lock",
        {
          locked:
            !data.locked
        }
      );


    if(result.ok){

      data.locked =
        !data.locked;

      showControl();

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================================
   CHANNEL
========================================================= */

async function changeChannel(){

  const channel =
    prompt(
      "กรอกหมายเลขช่อง",
      data.channel
    );


  if(
    channel === null ||
    channel.trim() === ""
  ){

    return;

  }


  try{

    const result =
      await request(
        "channel",
        {
          channel:
            channel.trim()
        }
      );


    if(result.ok){

      data.channel =
        channel.trim();

      showControl();

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================================
   RESET
========================================================= */

async function resetQueue(){

  const confirmReset =
    confirm(
      "ต้องการรีเซ็ตคิวทั้งหมดของวันนี้หรือไม่?"
    );


  if(!confirmReset)
    return;


  try{

    const result =
      await request(
        "reset"
      );


    if(result.ok){

      data.current =
        "-";

      data.waiting =
        0;

      alert(
        "รีเซ็ตคิวเรียบร้อยแล้ว"
      );

      showControl();

    }else{

      alert(
        result.error ||
        "รีเซ็ตไม่สำเร็จ"
      );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================================
   TAKE TICKET
========================================================= */

async function takeTicket(){

  try{

    const result =
      await request(
        "take"
      );


    if(result.ok){

      beep();


      const number =
        document.getElementById(
          "ticketNumber"
        );


      number.textContent =
        result.number;


      document
        .getElementById(
          "ticketPopup"
        )
        .classList
        .add("show");


    }else{

      alert(
        result.error ||
        "ออกบัตรคิวไม่ได้"
      );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================================
   CLOSE TICKET
========================================================= */

function closeTicket(){

  const popup =
    document.getElementById(
      "ticketPopup"
    );


  if(popup){

    popup.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  if(mode === "control"){

    if(verified){

      showControl();

    }else{

      showLogin();

    }

    return;

  }


  if(mode === "kiosk"){

    showKiosk();

    return;

  }


  showDisplay();

}


/* =========================================================
   START
========================================================= */

render();


/* โหลดข้อมูล */

refresh();


/* อัปเดตทุก 2 วินาที */

setInterval(
  refresh,
  2000
);


/* =========================================================
   KIOSK AUTO CLOSE
========================================================= */

document.addEventListener(
  "click",
  function(event){

    if(
      event.target.id ===
      "ticketPopup"
    ){

      closeTicket();

    }

  }
);

</script>

</body>
</html>
