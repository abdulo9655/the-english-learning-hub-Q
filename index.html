<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Queue Remote</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#fff7fb;
  color:#481d35;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding:14px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% -10%,
      #ffafd1 0%,
      #ffe0ec 27%,
      #fff6fa 60%,
      #ffffff 100%
    );
}

/* พื้นหลัง */

.circle{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:0;
}

.circle1{
  width:320px;
  height:320px;
  background:#ff9fc8;
  left:-170px;
  top:-160px;
  opacity:.28;
}

.circle2{
  width:360px;
  height:360px;
  background:#ffc9df;
  right:-180px;
  bottom:-160px;
  opacity:.35;
}

.circle3{
  width:150px;
  height:150px;
  background:#ff8fbd;
  right:12%;
  top:18%;
  opacity:.12;
}

/* HEADER */

.header{
  position:relative;
  z-index:2;

  width:min(1200px,100%);
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:15px 19px;

  background:#ffffffdf;
  border:1px solid #ffffff;

  border-radius:21px;

  box-shadow:
    0 12px 40px #d72e7618;

  backdrop-filter:blur(18px);
}

.logo{
  font-size:23px;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo span{
  color:#eb3f86;
}

.mode{
  background:#fff0f7;
  color:#cf3976;

  padding:8px 13px;
  border-radius:50px;

  font-size:13px;
  font-weight:900;
}

/* CARD */

.container{
  position:relative;
  z-index:2;

  width:min(1050px,100%);
  margin:24px auto;
}

.card{
  background:#fffffff2;
  border:1px solid white;
  border-radius:29px;

  padding:28px;

  box-shadow:
    0 22px 70px #c92d7018;

  backdrop-filter:blur(20px);
}

/* DISPLAY */

.displayArea{
  position:relative;
  z-index:2;

  min-height:
    calc(100vh - 105px);

  display:grid;
  place-items:center;
}

.displayCard{
  width:min(900px,95vw);
  text-align:center;
  padding:40px 25px;
}

.displayTitle{
  font-size:
    clamp(18px,3vw,28px);

  color:#ad527d;
  font-weight:900;
}

.currentQueue{
  font-size:
    clamp(95px,22vw,220px);

  line-height:.9;

  margin:42px 0 25px;

  color:#e83c83;

  font-weight:1000;

  letter-spacing:-7px;

  text-shadow:
    0 12px 35px #e83c8320;
}

.channel{
  font-size:
    clamp(21px,4vw,32px);

  color:#8e476b;
  font-weight:900;
}

.waiting{
  margin-top:15px;

  color:#aa7190;
  font-size:17px;
}

/* CONTROL */

.controlTitle{
  font-size:23px;
  font-weight:1000;
  color:#702b4e;
}

.controlCurrent{
  text-align:center;

  font-size:
    clamp(80px,16vw,155px);

  line-height:1;

  margin:28px 0;

  color:#e83c83;

  font-weight:1000;
}

.controlInfo{
  text-align:center;
  color:#a86b89;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:13px;

  margin-top:27px;
}

.btn{
  min-height:62px;

  border-radius:17px;

  font-size:17px;
  font-weight:1000;

  transition:.15s;
}

.btn:active{
  transform:scale(.96);
}

.primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      #ff65a5,
      #e92f7d
    );

  box-shadow:
    0 10px 28px #e43a8128;
}

.secondary{
  color:#983e68;
  background:#fff0f7;
}

.success{
  color:white;

  background:
    linear-gradient(
      135deg,
      #36c99a,
      #17a878
    );
}

.danger{
  color:white;

  background:
    linear-gradient(
      135deg,
      #ff7188,
      #eb3e5e
    );
}

.wide{
  grid-column:1/-1;
}

/* KIOSK */

.kioskArea{
  position:relative;
  z-index:2;

  min-height:
    calc(100vh - 105px);

  display:grid;
  place-items:center;
}

.kioskButton{
  width:min(700px,94vw);

  height:min(580px,67vh);

  border-radius:46px;

  color:white;

  background:
    linear-gradient(
      145deg,
      #ff78b1,
      #ed3984
    );

  box-shadow:
    0 30px 90px #d72d7735;

  font-size:
    clamp(43px,9vw,85px);

  font-weight:1000;

  transition:.15s;
}

.kioskButton:active{
  transform:scale(.97);
}

.kioskIcon{
  display:block;
  margin-bottom:18px;
}

.kioskSub{
  display:block;

  margin-top:20px;

  font-size:18px;
  opacity:.88;

  font-weight:700;
}

/* TICKET POPUP */

.popup{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;
  place-items:center;

  padding:20px;

  background:#43162f9e;

  backdrop-filter:blur(9px);
}

.popup.show{
  display:grid;
}

.ticket{
  width:min(560px,94vw);

  background:white;

  color:#481d35;

  border-radius:32px;

  padding:35px;

  text-align:center;

  box-shadow:
    0 30px 100px #0003;

  animation:
    popup .25s ease;
}

@keyframes popup{

  from{
    opacity:0;
    transform:scale(.85);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

.ticketTitle{
  font-size:22px;
  color:#a5577e;
  font-weight:900;
}

.ticketNumber{
  margin:25px 0;

  font-size:
    clamp(90px,20vw,170px);

  line-height:1;

  color:#e83c83;

  font-weight:1000;
}

.ticketText{
  color:#a66c8b;
}

/* LOCK */

.lock{
  position:fixed;
  inset:0;

  z-index:200;

  display:none;
  place-items:center;

  text-align:center;

  background:#fff8fceF;

  backdrop-filter:blur(20px);
}

.lock.show{
  display:grid;
}

.lockIcon{
  font-size:90px;
}

.lockTitle{
  margin-top:15px;

  font-size:31px;

  font-weight:1000;

  color:#702b4e;
}

.lockText{
  margin-top:8px;
  color:#a86c8b;
}

/* STATUS */

.status{
  display:inline-flex;
  align-items:center;

  gap:7px;

  color:#299d76;

  font-size:13px;
  font-weight:900;
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#31c18e;
}

/* MOBILE */

@media(max-width:700px){

  .app{
    padding:9px;
  }

  .header{
    padding:13px 14px;
    border-radius:18px;
  }

  .logo{
    font-size:19px;
  }

  .buttons{
    grid-template-columns:1fr;
  }

  .wide{
    grid-column:auto;
  }

  .card{
    padding:20px;
    border-radius:24px;
  }

  .displayCard{
    padding:35px 17px;
  }

  .kioskButton{
    height:63vh;
    border-radius:36px;
  }

}

@media(max-height:600px){

  .kioskButton{
    height:72vh;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>

  <div id="root"></div>

</div>

<script>

/* =====================================================
   API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbx0vgr-86AFRYBAzJCglbLAaMjauxQ65YM_5lqlJZiDsUFPWVmdLzx2Smp5NhsHTjQODQ/exec";


/* =====================================================
   MODE
===================================================== */

const params =
new URLSearchParams(
  location.search
);

const mode =
params.get("mode") || "display";


/*
  display = หน้าจอ
  control = เจ้าหน้าที่
  kiosk   = กดบัตร
*/


/* =====================================================
   DATA
===================================================== */

let data = {

  current:"-",

  channel:"1",

  locked:false,

  waiting:0

};


/* =====================================================
   JSONP
===================================================== */

function request(
  action,
  body={}
){

  return new Promise(
    (resolve,reject)=>{

      const callback =
        "queue_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random()*99999
        );


      let script =
        document.createElement(
          "script"
        );


      window[callback] =
        function(result){

          try{
            delete window[callback];
          }catch(e){}

          if(script)
            script.remove();

          resolve(result);

        };


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callback
      );


      Object.keys(body)
        .forEach(
          key=>{

            query.set(
              key,
              body[key]
            );

          }
        );


      script.src =
        API +
        "?" +
        query.toString();


      script.onerror =
        function(){

          try{
            delete window[callback];
          }catch(e){}

          script.remove();

          reject(
            new Error(
              "เชื่อมต่อระบบคิวไม่ได้"
            )
          );

        };


      document.body.appendChild(
        script
      );


      setTimeout(
        ()=>{

          if(
            window[callback]
          ){

            try{
              delete window[callback];
            }catch(e){}

            script.remove();

            reject(
              new Error(
                "ระบบไม่ตอบกลับ"
              )
            );

          }

        },
        12000
      );

    }
  );

}


/* =====================================================
   SOUND
===================================================== */

function beep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext)
      return;


    const ctx =
      new AudioContext();


    const notes =
      [660,880,1040];


    notes.forEach(
      (frequency,index)=>{

        const osc =
          ctx.createOscillator();

        const gain =
          ctx.createGain();


        osc.type =
          "sine";

        osc.frequency.value =
          frequency;


        osc.connect(gain);

        gain.connect(
          ctx.destination
        );


        gain.gain.setValueAtTime(
          .12,
          ctx.currentTime +
          index*.15
        );


        osc.start(
          ctx.currentTime +
          index*.15
        );


        osc.stop(
          ctx.currentTime +
          index*.15 +
          .13
        );

      }
    );

  }catch(error){

    console.log(error);

  }

}


/* =====================================================
   VOICE
===================================================== */

function speak(
  number,
  channel
){

  try{

    if(
      !window.speechSynthesis
    )
      return;


    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(

        "เชิญหมายเลข " +
        number +
        " ที่ช่อง " +
        channel

      );


    utterance.lang =
      "th-TH";

    utterance.rate =
      .88;

    utterance.pitch =
      1;


    speechSynthesis.speak(
      utterance
    );

  }catch(error){

    console.log(error);

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    })[char]
  );

}


/* =====================================================
   HEADER
===================================================== */

function header(
  title
){

  return `

    <div class="header">

      <div class="logo">
        QUEUE
        <span>REMOTE</span>
      </div>

      <div
        style="
          display:flex;
          align-items:center;
          gap:12px;
        "
      >

        <div class="status">
          <span class="dot"></span>
          ONLINE
        </div>

        <div class="mode">
          ${esc(title)}
        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   DISPLAY
===================================================== */

function showDisplay(){

  root.innerHTML = `

    ${header("DISPLAY")}

    <div class="displayArea">

      <div class="card displayCard">

        <div class="displayTitle">
          🎀 กรุณารอเรียกคิว
        </div>

        <div
          class="currentQueue"
        >
          ${esc(data.current)}
        </div>

        <div class="channel">
          ช่อง ${esc(data.channel)}
        </div>

        <div class="waiting">
          คิวที่รออยู่
          <b>
            ${data.waiting}
          </b>
          คิว
        </div>

      </div>

    </div>


    <div
      class="lock ${
        data.locked
        ? "show"
        : ""
      }"
    >

      <div>

        <div class="lockIcon">
          🔒
        </div>

        <div class="lockTitle">
          หน้าจอถูกล็อก
        </div>

        <div class="lockText">
          กรุณารอเจ้าหน้าที่ปลดล็อก
        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   CONTROL
===================================================== */

function showControl(){

  root.innerHTML = `

    ${header("CONTROL")}

    <div class="container">

      <div class="card">

        <div class="controlTitle">
          🎛️ ศูนย์ควบคุมคิว
        </div>

        <div
          style="
            margin-top:6px;
            color:#ad7391;
            font-size:14px;
          "
        >
          เจ้าหน้าที่
        </div>


        <div class="controlCurrent">
          ${esc(data.current)}
        </div>


        <div class="controlInfo">

          ช่อง
          <b>
            ${esc(data.channel)}
          </b>

          &nbsp; • &nbsp;

          รอ
          <b>
            ${data.waiting}
          </b>
          คิว

        </div>


        <div class="buttons">


          <button
            class="btn primary"
            onclick="nextQueue()"
          >
            ▶️ เรียกคิวถัดไป
          </button>


          <button
            class="btn secondary"
            onclick="recallQueue()"
          >
            🔊 เรียกซ้ำ
          </button>


          <button
            class="btn secondary"
            onclick="changeChannel()"
          >
            🏢 เปลี่ยนช่อง
          </button>


          <button
            class="btn ${
              data.locked
              ? "success"
              : "danger"
            }"
            onclick="toggleLock()"
          >

            ${
              data.locked
              ? "🔓 ปลดล็อกหน้าจอ"
              : "🔒 ล็อกหน้าจอ"
            }

          </button>


          <button
            class="btn danger wide"
            onclick="resetQueue()"
          >
            🗑️ รีเซ็ตคิววันนี้
          </button>


        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   KIOSK
===================================================== */

function showKiosk(){

  root.innerHTML = `

    ${header("KIOSK")}

    <div class="kioskArea">

      <button
        class="kioskButton"
        onclick="takeTicket()"
      >

        <span class="kioskIcon">
          🎫
        </span>

        กดบัตรคิว

        <span class="kioskSub">
          แตะที่นี่เพื่อรับหมายเลขคิว
        </span>

      </button>

    </div>


    <div
      id="ticketPopup"
      class="popup"
    >

      <div class="ticket">

        <div class="ticketTitle">
          🎀 บัตรคิวของคุณ
        </div>

        <div
          id="ticketNumber"
          class="ticketNumber"
        >
          A000
        </div>

        <div class="ticketText">
          กรุณารอเรียกหมายเลขของคุณ
        </div>

        <button
          class="btn primary"
          style="
            width:100%;
            margin-top:25px;
          "
          onclick="closeTicket()"
        >
          ✓ ตกลง
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   REFRESH
===================================================== */

async function refresh(){

  try{

    const result =
      await request(
        "state"
      );


    if(
      result &&
      result.current !== undefined
    ){

      data = {

        current:
          result.current ?? "-",

        channel:
          result.channel ?? "1",

        locked:
          result.locked === true ||
          String(
            result.locked
          ).toLowerCase()
          === "true",

        waiting:
          Number(
            result.waiting ?? 0
          )

      };


      render();

    }

  }catch(error){

    console.log(
      "Refresh:",
      error
    );

  }

}


/* =====================================================
   NEXT QUEUE
===================================================== */

async function nextQueue(){

  try{

    const result =
      await request(
        "next"
      );


    if(result.ok){

      beep();


      speak(
        result.number,
        result.channel
      );


      data.current =
        result.number;


      data.channel =
        result.channel;


      showControl();


    }else{

      alert(
        result.error ||
        "ไม่มีคิวรอ"
      );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   RECALL
===================================================== */

function recallQueue(){

  if(
    !data.current ||
    data.current === "-"
  ){

    alert(
      "ยังไม่มีคิวที่ถูกเรียก"
    );

    return;

  }


  beep();


  speak(
    data.current,
    data.channel
  );

}


/* =====================================================
   LOCK
===================================================== */

async function toggleLock(){

  try{

    const newValue =
      !data.locked;


    const result =
      await request(
        "lock",
        {
          locked:newValue
        }
      );


    if(result.ok){

      data.locked =
        newValue;


      showControl();

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   CHANNEL
===================================================== */

async function changeChannel(){

  const value =
    prompt(
      "กรอกหมายเลขช่อง",
      data.channel
    );


  if(
    value === null ||
    value.trim() === ""
  ){

    return;

  }


  try{

    const result =
      await request(
        "channel",
        {
          channel:value.trim()
        }
      );


    if(result.ok){

      data.channel =
        value.trim();


      showControl();

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   RESET
===================================================== */

async function resetQueue(){

  if(
    !confirm(
      "ต้องการรีเซ็ตคิวทั้งหมดของวันนี้หรือไม่?"
    )
  ){

    return;

  }


  try{

    const result =
      await request(
        "reset"
      );


    if(result.ok){

      data.current =
        "-";

      data.waiting =
        0;


      alert(
        "รีเซ็ตคิวเรียบร้อยแล้ว"
      );


      showControl();

    }else{

      alert(
        result.error ||
        "รีเซ็ตไม่สำเร็จ"
      );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   TAKE TICKET
===================================================== */

async function takeTicket(){

  try{

    const result =
      await request(
        "take"
      );


    if(result.ok){

      beep();


      const number =
        document.getElementById(
          "ticketNumber"
        );


      number.textContent =
        result.number;


      document
        .getElementById(
          "ticketPopup"
        )
        .classList
        .add("show");


    }else{

      alert(
        result.error ||
        "ไม่สามารถออกบัตรคิวได้"
      );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   CLOSE TICKET
===================================================== */

function closeTicket(){

  const popup =
    document.getElementById(
      "ticketPopup"
    );


  if(popup){

    popup
      .classList
      .remove("show");

  }

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  if(mode === "control"){

    showControl();

  }

  else if(mode === "kiosk"){

    showKiosk();

  }

  else{

    showDisplay();

  }

}


/* =====================================================
   START
===================================================== */

render();

refresh();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
  refresh,
  2000
);

</script>

</body>
</html>
